# Controlli automatici a ogni push e pull request: se qualcosa si rompe,
# GitHub mostra una X rossa accanto al commit prima che arrivi su Vercel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: neon-dominance-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: neon-dominance-main/package-lock.json
      - run: npm ci
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
